name: Build and deploy dcb-quarto-site
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
      
      - name: "Setup R"
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
        
      - name: "Install system dependencies"
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages:
            any::shinylive@0.1.1
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::ggtext
            any::gridExtra
            any::kableExtra
            any::bslib
            any::tidyverse
            any::shiny
            any::extRemes
            any::httr
            any::jsonlite
            any::modelsummary
            any::showtext
      
      - name: "Setup Quarto"
        uses: quarto-dev/quarto-actions/setup@v2
      
      - name: Create .ssh directory
        run: mkdir ~/.ssh && chmod 700 ~/.ssh
      
      - name: Install SSH key
        run: echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519_deploy && chmod 600 ~/.ssh/id_ed25519_deploy
      
      - name: Create known hosts
        run: echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      
      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2
        
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      
      - name: Deploy site
        run: rsync -a -e "ssh -i ~/.ssh/id_ed25519_deploy" _site deploy@100.69.237.87:/home/deploy/dcb-quarto-site
